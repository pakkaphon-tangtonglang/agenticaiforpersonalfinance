# Render Blueprint — Personal Finance AI backend (free tier).
# Docs: https://render.com/docs/blueprint-spec
#
# Vars marked `sync: false` are prompted in the Render dashboard on first
# sync — fill them with the values from your local `.env` (never commit
# real API keys).
#
# Free-tier notes: the service sleeps after 15 min idle and its disk is
# ephemeral — bootstrap (migrations + RAG index) runs at every start.
# preDeployCommand is NOT available on free instances, so it is folded
# into startCommand. See docs/deployment.md.
services:
  - type: web
    name: personal-finance-ai
    runtime: python
    plan: free
    region: singapore # closest region to Thailand
    branch: main
    buildCommand: pip install uv && uv sync --frozen --all-extras --no-dev
    startCommand: uv run python scripts/bootstrap_runtime.py && uv run uvicorn finance_ai.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Runtime
      - key: PYTHON_VERSION
        value: "3.13"
      # Deployment mode
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: WARNING
      # Neon Postgres (pooled connection string) — set as a secret in the
      # dashboard; a local SQLite fallback would be wiped on every deploy
      - key: DB_URL
        sync: false
      - key: RAG_KNOWLEDGE_BASE_DIRECTORY
        value: docs/knowledge_base
      # Guru sources: the repo stores links only (docs/gurus/sources.yaml);
      # articles are fetched + indexed in a background thread after startup.
      - key: GURU_FETCH_ON_STARTUP
        value: "true"
      # LLM chat/agents, OCR and RAG embeddings all via Google Gemini.
      # (To go back to OpenRouter: LLM_PROVIDER/OCR_PROVIDER=openrouter,
      # OPENROUTER_MODEL, OCR_MODEL and an OPENROUTER_API_KEY secret.)
      - key: LLM_PROVIDER
        value: google
      - key: GOOGLE_MODEL
        value: gemini-3.5-flash
      - key: LLM_MAX_TOKENS
        value: "7000"
      - key: OCR_PROVIDER
        value: google
      - key: OCR_MODEL
        value: gemini-3.5-flash
      - key: RAG_EMBEDDING_PROVIDER
        value: google
      - key: RAG_EMBEDDING_MODEL
        value: models/gemini-embedding-001
      # Secrets — prompted in the Render dashboard, copy from local .env.
      # OCR_API_KEY must be the same Google key as GOOGLE_API_KEY.
      - key: GOOGLE_API_KEY
        sync: false
      - key: OCR_API_KEY
        sync: false
      # Public API protection: clients must send this value in X-API-Key
      # (exempt: /health and /line/webhook, which verifies its own signature)
      - key: API_KEY
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      # Optional (add later via dashboard Environment tab):
      #   LANGSMITH_TRACING / LANGSMITH_API_KEY / LANGSMITH_PROJECT — tracing.
