# Render Blueprint — Personal Finance AI backend (free tier).
# Docs: https://render.com/docs/blueprint-spec
#
# Vars marked `sync: false` are prompted in the Render dashboard on first
# sync — fill them with the values from your local `.env` (never commit
# real API keys).
#
# Free-tier notes: the service sleeps after 15 min idle and its disk is
# ephemeral — bootstrap (migrations + RAG index) runs at every start.
# preDeployCommand is NOT available on free instances, so it is folded
# into startCommand. See docs/deployment.md.
services:
  - type: web
    name: personal-finance-ai
    runtime: python
    plan: free
    region: singapore # closest region to Thailand
    branch: main
    # No `embeddings` extra: sentence-transformers pulls in transformers +
    # torch, and langchain_core imports transformers whenever it is installed
    # (~360 MB extra RAM, over the 512 MB free limit). Prod embeds via Gemini.
    # --no-sync at start: keep the lean build env (plain `uv run` would add
    # the dev group back). --workers 1: uvicorn otherwise reads Render's
    # WEB_CONCURRENCY, and each worker loads the full app (~260 MB).
    buildCommand: pip install uv && uv sync --frozen --extra openrouter --extra ollama --no-dev
    startCommand: uv run --no-sync python scripts/bootstrap_runtime.py && uv run --no-sync uvicorn finance_ai.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      # glibc gives every thread its own malloc arena (up to 8 x CPUs), which
      # inflates RSS on Linux; 2 arenas keeps the threaded app well under 512 MB.
      - key: MALLOC_ARENA_MAX
        value: "2"
      # Runtime
      - key: PYTHON_VERSION
        value: "3.13"
      # Deployment mode
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: WARNING
      # Neon Postgres (pooled connection string) — set as a secret in the
      # dashboard; a local SQLite fallback would be wiped on every deploy
      - key: DB_URL
        sync: false
      - key: RAG_KNOWLEDGE_BASE_DIRECTORY
        value: docs/knowledge_base
      # Guru sources: the repo stores links only (docs/gurus/sources.yaml);
      # articles are fetched + indexed in a background thread after startup.
      - key: GURU_FETCH_ON_STARTUP
        value: "true"
      # LLM chat/agents, OCR and RAG embeddings all via Google Gemini.
      # (To go back to OpenRouter: LLM_PROVIDER/OCR_PROVIDER=openrouter,
      # OPENROUTER_MODEL, OCR_MODEL and an OPENROUTER_API_KEY secret.)
      - key: LLM_PROVIDER
        value: google
      - key: GOOGLE_MODEL
        value: gemini-3.5-flash
      - key: LLM_MAX_TOKENS
        value: "7000"
      - key: OCR_PROVIDER
        value: google
      - key: OCR_MODEL
        value: gemini-3.5-flash
      - key: RAG_EMBEDDING_PROVIDER
        value: google
      - key: RAG_EMBEDDING_MODEL
        value: models/gemini-embedding-001
      # Store embeddings in Postgres: restarts/wake-ups reuse them instead of
      # re-embedding everything (free tier: 1,000 embedding requests/day).
      - key: RAG_EMBEDDING_CACHE_ENABLED
        value: "true"
      # Secrets — prompted in the Render dashboard, copy from local .env.
      # OCR_API_KEY must be the same Google key as GOOGLE_API_KEY.
      - key: GOOGLE_API_KEY
        sync: false
      - key: OCR_API_KEY
        sync: false
      # SEC Open API key (Fund API V2): Thai mutual fund search + daily NAV
      # on the asset page. Without it, fund search and fund prices are off.
      - key: SEC_API_KEY
        sync: false
      # Public API protection: per-IP rate limit. No API_KEY: the web UI is
      # served from this same host, and a key shipped in public JavaScript
      # would not be secret. (Setting API_KEY would block the web UI.)
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      # Optional (add later via dashboard Environment tab):
      #   LANGSMITH_TRACING / LANGSMITH_API_KEY / LANGSMITH_PROJECT — tracing.
