name: CI

on:
  push:
    branches: [main, "upgrade/**"]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest

      - name: Install dependencies
        # --all-extras: tests instantiate OpenRouter/Google/Ollama clients and
        # the ChromaDB store, which live in optional-dependencies. Without
        # this, mypy sees missing third-party packages as Any (unused-ignore
        # errors) and pytest fails on ImportError.
        run: uv sync --group dev --all-extras

      - name: Check formatting
        run: uv run black --check src/finance_ai tests/

      - name: Run linter
        run: uv run pylint src/finance_ai tests/ --fail-under=9.0

      - name: Run type checker
        run: uv run mypy src/finance_ai tests/

      - name: Run tests with coverage
        run: uv run pytest --cov=src/finance_ai --cov-fail-under=90
