name: Keep Render awake

# Render's free tier sleeps after 15 idle minutes, and the first request after
# that takes ~50 s. Pinging /health every 10 minutes keeps the service warm.
# GitHub may delay scheduled runs by a few minutes, and pauses schedules in
# repos with no activity for 60 days (re-enable from the Actions tab).
# Override the target with the repository variable HEALTH_URL if the
# service moves.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL || 'https://personal-finance-ai-wcr0.onrender.com/health' }}
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 20 --retry-all-errors \
            --max-time 90 "$HEALTH_URL"
