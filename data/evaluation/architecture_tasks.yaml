# Architecture comparison study — 60 tasks (4.11 study A).
# Runs against the seeded demo user (tools/demo_seed_service.py) and the fixed
# market snapshot (evaluation/architectures/market_snapshot.py): PTT.BK = 33.25 THB,
# AOT.BK news headline mentions "ผู้โดยสาร".
# answer_checks: "|" separates accepted alternatives; commas are ignored when matching.
# Tax tasks avoid social security, SSF and two-parent allowances (known calculator issues,
# docs/all_known_problem.md 4.11), so this study measures routing, not those bugs.
name: architecture_study
version: "1.0"
tasks:
  # ===================== Single topic: tax (7) =====================
  - task_id: tax_01
    query: "เงินเดือน 50,000 บาท ไม่มีค่าลดหย่อนอื่นนอกจากส่วนตัว คำนวณภาษีปีนี้ให้หน่อย"
    category: single
    acceptable_agents: [tax]
    required_tools: [[calculate_thai_tax]]
    answer_checks: ["21,500|21500"]
  - task_id: tax_02
    query: "รายได้ปีละ 1,200,000 บาท มีลูก 1 คน ต้องเสียภาษีเท่าไร"
    category: single
    acceptable_agents: [tax]
    required_tools: [[calculate_thai_tax]]
    answer_checks: ["117,500|117500"]
  - task_id: tax_03
    query: "เงินเดือน 80,000 บาท จ่ายเบี้ยประกันชีวิตปีละ 50,000 บาท ภาษีเท่าไร"
    category: single
    acceptable_agents: [tax]
    required_tools: [[calculate_thai_tax]]
    answer_checks: ["65,000|65000"]
  - task_id: tax_04
    query: "รายได้ทั้งปี 720,000 บาท ซื้อ RMF 100,000 บาท ต้องจ่ายภาษีเท่าไร"
    category: single
    acceptable_agents: [tax]
    required_tools: [[calculate_thai_tax]]
    answer_checks: ["23,500|23500"]
  - task_id: tax_05
    query: "เงินเดือน 35,000 บาท ต้องเสียภาษีไหม ถ้าเสียเสียเท่าไร"
    category: single
    acceptable_agents: [tax]
    required_tools: [[calculate_thai_tax]]
    answer_checks: ["5,500|5500"]
  - task_id: tax_06
    query: "รายได้ปีละ 2 ล้านบาท เลี้ยงดูแม่ 1 คน จ่ายประกันสุขภาพตัวเอง 20,000 บาท ภาษีเท่าไร"
    category: single
    acceptable_agents: [tax]
    required_tools: [[calculate_thai_tax]]
    answer_checks: ["312,500|312500"]
  - task_id: tax_07
    query: "ค่าลดหย่อนส่วนตัวปีนี้ได้เท่าไร"
    category: single
    acceptable_agents: [tax]
    answer_checks: ["60,000|60000"]
    note: "Knowledge question; no tool required."

  # ===================== Single topic: expense (7) =====================
  - task_id: exp_01
    query: "จ่ายค่ากาแฟ 80 บาท"
