  # ===================== Single topic: planning (7) =====================
  - task_id: pln_01
    query: "อยากเก็บเงินให้ได้ 100,000 บาทภายใน 12 เดือน ต้องออมเดือนละเท่าไร"
    category: single
    acceptable_agents: [planning]
    required_tools: [[calculate_saving_plan]]
  - task_id: pln_02
    query: "ตั้งเป้าหมายเก็บเงินดาวน์บ้าน 500,000 บาทภายใน 3 ปี"
    category: single
    acceptable_agents: [planning]
    required_tools: [[create_financial_goal]]
    db_checks: [{kind: goal_target, amount: "500000"}]
  - task_id: pln_03
    query: "เป้าหมายการเงินของฉันตอนนี้คืบหน้าไปแค่ไหนแล้ว"
    category: single
    acceptable_agents: [planning, report]
    required_tools: [[view_financial_goals, get_goals_summary_cross, generate_financial_report_tool]]
    note: "Audit 2026-11-02: the report tool output includes the goal-progress table."
    answer_checks: ["96,000|96000", "35,000|35000"]
  - task_id: pln_04
    query: "เพิ่มเงินเข้ากองทุนสำรองฉุกเฉินอีก 10,000 บาท"
    category: single
    acceptable_agents: [planning, expense]
    note: "Router intent text sends savings records to expense; both agents have a goal-update tool."
    required_tools: [[update_goal_progress, update_savings_goal_cross]]
    db_checks: [{kind: goal_current, amount: "106000"}]
  - task_id: pln_05
    query: "เงินเดือน 50,000 บาท ถ้าจะออมก่อนใช้แบบ pay yourself first ควรแบ่งออมเท่าไร"
    category: single
    acceptable_agents: [planning]
