# Routing questions for the router study (4.11 B, written 2026-11-07).
#
# expected = where the production router should send the question:
#   tax | expense | asset_monitoring | planning | recommendation | report
#   general_chat  -> router intent "general" or "unknown" (both open General Chat)
#   clarify       -> router asks back (intent "general" with confidence < 0.7)
# Labels follow the category rules in the production router prompt
# (src/finance_ai/agents/prompts.py, ORCHESTRATOR_PROMPT_HEAD). No question copies a
# few-shot example in that prompt, the September 35-question set or the architecture tasks.
# difficulty "hard" = a boundary rule from the prompt decides the label
# (e.g. paid insurance -> expense, buying gold -> asset_monitoring).
# also_accept: second labels added after the 2026-11-07 audit, only where the router prompt's own
# rules support the label the models chose (see docs/evaluation/router-thinking-notes.md).
name: routing_v2
