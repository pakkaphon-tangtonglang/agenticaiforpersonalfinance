name: quality_evaluation
version: "1.0"
cases:
  - case_id: "qual_001"
    query: "คำนวณภาษีปี 2024 เงินเดือน 50,000 บาทต่อเดือน"
    expected_agent: "tax"
    tags: ["tax", "calculation"]

  - case_id: "qual_002"
    query: "ค่าลดหย่อนอะไรบ้างที่ใช้ได้"
    expected_agent: "tax"
    tags: ["tax", "deduction"]

  - case_id: "qual_003"
    query: "จ่ายค่ากาแฟ 80 บาท"
    expected_agent: "expense"
    tags: ["expense", "record"]

  - case_id: "qual_004"
    query: "สรุปค่าใช้จ่ายเดือนนี้"
