[tool.poetry]
name = "finance-ai"
version = "0.1.0"
description = "Multi-Agent Personal Finance AI System for Thai users"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/yourusername/personal-finance-ai"
repository = "https://github.com/yourusername/personal-finance-ai"
keywords = ["finance", "ai", "tax", "investment", "thailand"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
packages = [{include = "finance_ai", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
# LLM Support (Google Gemini + OLLAMA/THALLE + OpenRouter)
google-genai = "^2.0.0"
# Agent Framework
langchain = "^1.0.0"
langchain-google-genai = "^4.0.0"
langgraph = "^1.0.0"
# MCP (Model Context Protocol)
mcp = "^1.0.0"
langchain-mcp-adapters = "^0.1.0"
# API Framework
fastapi = "^0.139.0"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
# Database
sqlalchemy = "^2.0.36"
alembic = "^1.14.2"
# Data Validation
pydantic = "^2.10.5"
pydantic-settings = "^2.7.1"
# RAG & Embeddings
chromadb = "^1.5.0"
langchain-text-splitters = "^1.0.0"
langchain-chroma = "^1.0.0"
# sentence-transformers = "^3.4.1"  # Optional: install for local embeddings
# Scheduling
apscheduler = "^3.10.0"
# Visualization / Export (non-Streamlit)
plotly = ">=6.0"
fpdf2 = ">=2.8"
openpyxl = ">=3.1"
# Utilities
python-dotenv = "^1.0.1"
python-multipart = "^0.0.20"
httpx = "^0.28.1"
# Thai language support
pythainlp = "^5.0.6"
pyyaml = "^6.0.3"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^8.3.5"
pytest-cov = "^6.0.0"
pytest-asyncio = "^0.25.2"
pytest-mock = "^3.14.0"
responses = "^0.25.4"
# Code Quality
black = "^24.10.0"
pylint = "^3.3.4"
mypy = "^1.15.0"
# Pre-commit
pre-commit = "^4.0.1"
# Type stubs
types-requests = "^2.32.0.20241229"
# Development utilities
ipython = "^8.31.0"
rich = "^13.9.4"
types-pyyaml = "^6.0.12.20250915"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# =============================================================================
# Tool Configurations
# =============================================================================

[tool.black]
line-length = 100
target-version = ['py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pylint.main]
jobs = 0  # Use all CPU cores
fail-under = 9.0
ignore = ["CVS", ".git", "__pycache__", ".mypy_cache", ".pytest_cache"]
persistent = true
suggestion-mode = true

[tool.pylint.messages_control]
max-line-length = 100
disable = [
    "C0114",  # missing-module-docstring (we use package-level docs)
    "R0903",  # too-few-public-methods (common for Pydantic models)
]

[tool.pylint.format]
max-line-length = 100
max-module-lines = 500

[tool.pylint.design]
max-args = 5
max-attributes = 10
max-branches = 12
max-locals = 15
max-returns = 6
max-statements = 20  # Enforces 20-line function limit

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true
strict_optional = true
strict = true

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "sentence_transformers.*",
    "langchain.*",
    "langchain_chroma.*",
    "langchain_text_splitters.*",
    "langchain_community.*",
    "langchain_core.*",
    "langchain_google_genai.*",
    "langchain_ollama.*",
    "langchain_openai.*",
    "langchain_mcp_adapters.*",
    "langgraph.*",
    "mcp.*",
    "pythainlp.*",
    "google.genai.*",
    "google.generativeai.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src/finance_ai",
    "--cov-report=html",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=90",
    "-vv",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/ui/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
