# Readable source attribution for the knowledge base (shown on citation cards).
# Filenames are never shown to users; each entry gives the publisher (and a
# link) the document's content is based on. PDFs also set a display title,
# since they have no markdown heading.
#
# Fields: title (optional display title), source_title (optional, the exact
# name of the public source), source_publisher (required), source_url,
# source_kind ("original" = the file IS the published document,
# "compiled" = team-written notes based on the publisher's material).
#
# The .md notes were written by the team; their publisher is the official body
# whose rules or guidance the note summarises. Replace with the exact page or
# book whenever the original source of a note is known.
